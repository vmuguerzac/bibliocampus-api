spring.application.name=bibliocampus-api

# Base de datos
spring.datasource.url=jdbc:h2:file:./data/bibliocampus
spring.datasource.username=sa
spring.datasource.password=

# Crear tablas a partir de las entidades (para desarrollo)
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2
spring.h2.console.enabled=true
